name: "universal-inbox"

services:
  universal-inbox-db:
    image: "postgres:15@sha256:dfbbb0ad8cab91d41e99123664e37a9b25d0413426d4fb3154e4d668e5d35246"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universal-inbox -d universal-inbox"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - universal-inbox
    volumes:
      - universal-inbox-db:/var/lib/postgresql/data
    env_file:
      - universal-inbox-db.env

  universal-inbox-redis:
    image: "redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7"
    networks:
      - universal-inbox

  universal-inbox:
    image: "${UNIVERSAL_INBOX_IMAGE:?Set UNIVERSAL_INBOX_IMAGE to a reviewed local image digest}"
    command: ["serve"]
    depends_on:
      universal-inbox-db:
        condition: service_healthy
        restart: true
      universal-inbox-redis:
        condition: service_started

    networks:
      - universal-inbox
    env_file:
      - universal-inbox.env
    ports:
      - "127.0.0.1:8000:8000"

  universal-inbox-worker:
    image: "${UNIVERSAL_INBOX_IMAGE:?Set UNIVERSAL_INBOX_IMAGE to a reviewed local image digest}"
    command: ["start-workers"]
    depends_on:
      universal-inbox-db:
        condition: service_healthy
        restart: true
      universal-inbox-redis:
        condition: service_started
    networks:
      - universal-inbox
    env_file:
      - universal-inbox.env

networks:
  universal-inbox:

volumes:
  universal-inbox-db:
