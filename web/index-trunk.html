<!doctype html>
<html class="dark h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>
      Universal Inbox | take control of your notifications, seamlessly manage
      tasks
    </title>
    <meta
      description="Universal Inbox allow you to manage all your notifications in a single place and convert them into tasks"
    />
    <meta
      property="og:title"
      content="Universal Inbox | take control of your notifications, seamlessly manage tasks"
    />
    <meta
      property="og:description"
      content="Universal Inbox allow you to manage all your notifications in a single place and convert them into tasks"
    />
    <meta
      name="image"
      property="og:image"
      content="/images/ui-logo-light.jpg"
    />
    <meta
      property="twitter:title"
      content="Universal Inbox | take control of your notifications, seamlessly manage tasks"
    />
    <meta
      property="twitter:description"
      content="Universal Inbox allow you to manage all your notifications in a single place and convert them into tasks"
    />
    <meta property="twitter:image" content="/images/ui-logo-light.jpg" />
    <meta
      name="keywords"
      content="universal inbox, notification, task, solution"
    />
    <meta name="robots" content="index, nofollow" />
    <link rel="icon" href="/images/favicon.ico" />
    <link data-trunk rel="copy-dir" href="images" />
    <link data-trunk rel="copy-dir" href="pwa" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <link data-trunk rel="copy-file" href="js/headway-config.js" />

    <link rel="stylesheet" href="/css/flatpickr.min.css" />
    <link rel="stylesheet" href="/css/universal-inbox.min.css" />
    <link
      rel="preload"
      href="/api/front_config"
      as="fetch"
      crossorigin="use-credentials"
    />
    <link
      data-integrity="none"
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --all-features"
    />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon-180.png" />
  <meta name="theme-color" content="#111621" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Inbox" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

  <body class="h-full">
    <div id="main" class="h-full"></div>
    <script defer src="/headway-config.js"></script>
    <script
      defer
      id="headway-script"
      src="https://cdn.headwayapp.co/widget.js"
    ></script>
  </body>
</html>
